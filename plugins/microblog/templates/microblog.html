{% extends "base.html" %}

{% block title %}{{ Site.title | default('pyWork') }} - 微博{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/microblog.css">
{% endblock %}

{% block content %}
<div class="microblog-container">
    <div class="microblog-header">
        <h1>{{ Site.microblog_title | default('微博') }}</h1>
        <p class="microblog-description">{{ Site.microblog_description | default('快速分享你的想法') }}</p>
    </div>

    <!-- 发布框 -->
    <div class="compose-box" id="composeBox">
        <div class="compose-avatar" id="composeAvatar">?</div>
        <div class="compose-main">
            <textarea id="composeText" placeholder="有什么想法？" maxlength="500" rows="3"></textarea>
            <div class="compose-footer">
                <span class="char-count"><span id="charCount">0</span>/500</span>
                <button class="btn-send" id="sendBtn" onclick="sendMicroblog()">发布</button>
            </div>
        </div>
    </div>

    <!-- 微博列表 -->
    <div class="feed" id="feed">
        <div class="feed-loading">加载中...</div>
    </div>
</div>

<!-- 编辑弹窗 -->
<div class="edit-modal" id="editModal" style="display:none;">
    <div class="edit-modal-content">
        <h3>编辑微博</h3>
        <textarea id="editText" maxlength="500" rows="4"></textarea>
        <div class="edit-modal-actions">
            <button class="btn-cancel" onclick="closeEditModal()">取消</button>
            <button class="btn-save" onclick="updatePost()">保存</button>
        </div>
    </div>
</div>

<script src="/static/js/comments.js"></script>
<script>
    const currentAuthorId = {{ current_author_id | tojson }};
    const isAdmin = {{ is_admin | tojson }};
    let editingPostId = null;
    let currentOffset = 0;
    const pageSize = 20;
    let hasMore = true;
    // 当前页渲染的微博 ID，用于批量查询评论数
    const renderedPostIds = [];

    async function loadFeed(append = false) {
        try {
            const response = await fetch(`/api/microblog?limit=${pageSize + 1}&offset=${currentOffset}`);
            const posts = await response.json();

            hasMore = posts.length > pageSize;
            const displayPosts = posts.slice(0, pageSize);

            const feed = document.getElementById('feed');
            
            if (!append) {
                feed.innerHTML = '';
                renderedPostIds.length = 0;
            }

            if (!append && (!displayPosts || displayPosts.length === 0)) {
                feed.innerHTML = '<div class="feed-empty">还没有微博，快来发布第一条吧</div>';
                document.getElementById('loadMoreBtn')?.remove();
                return;
            }

            const html = displayPosts.map(post => {
                renderedPostIds.push(post.id);
                return renderPostCard(post);
            }).join('');

            // 单条微博卡片渲染（供列表与按 id 定位复用）
            function renderPostCard(post) {
                const avatar = post.author_avatar || post.author_name?.charAt(0).toUpperCase() || '?';
                const time = formatTime(post.created_at);
                const isOwner = post.author_id === currentAuthorId;
                const escapedContent = escapeHtml(post.content || post.body || '');
                const displayContent = linkifyText(escapedContent);
                return `
                    <div class="post" id="post-${post.id}">
                        <div class="post-avatar">${avatar}</div>
                        <div class="post-body">
                            <div class="post-header">
                                ${post.author_id ? `<a href="/author/${post.author_id}" class="post-author">${post.author_name || '匿名'}</a>` : `<span class="post-author">${post.author_name || '匿名'}</span>`}
                                <span class="post-time">${time}</span>
                            </div>
                            <div class="post-content">${displayContent}</div>
                            <div class="post-actions">
                                ${isOwner ? `<button class="btn-edit" data-content="${escapedContent}" onclick="openEditModal(${post.id})">编辑</button>` : ''}
                                ${(isOwner || isAdmin) ? `<button class="btn-delete" onclick="deletePost(${post.id})">删除</button>` : ''}
                                <button class="btn-comment" onclick="toggleMicroblogComments(${post.id})">评论</button>
                            </div>
                            <div class="microblog-comments" id="mb-comments-${post.id}"></div>
                        </div>
                    </div>
                `;
            }
            
            feed.insertAdjacentHTML('beforeend', html);
            
            // 更新加载更多按钮
            let loadMoreBtn = document.getElementById('loadMoreBtn');
            if (hasMore) {
                if (!loadMoreBtn) {
                    loadMoreBtn = document.createElement('button');
                    loadMoreBtn.id = 'loadMoreBtn';
                    loadMoreBtn.className = 'btn-load-more';
                    loadMoreBtn.textContent = '加载更多';
                    loadMoreBtn.onclick = () => {
                        currentOffset += pageSize;
                        loadFeed(true);
                        if (!hasMore) loadMoreBtn.remove();
                    };
                    feed.parentElement.appendChild(loadMoreBtn);
                }
            } else {
                loadMoreBtn?.remove();
            }

        } catch (e) {
            document.getElementById('feed').innerHTML = '<div class="feed-error">加载失败</div>';
        }
    }

    function toggleMicroblogComments(postId) {
        const container = document.getElementById('mb-comments-' + postId);
        if (!container) return;
        if (container.dataset.loaded) {
            container.style.display = container.style.display === 'none' ? '' : 'none';
            return;
        }
        container.classList.add('comments-section');
        container.dataset.targetType = 'microblog';
        container.dataset.targetId = postId;
        container.innerHTML = `
            <div class="comments-header"><span class="comments-title">评论</span> <span class="comments-count"></span></div>
            <div class="comment-login-hint" style="display:none">请先<a href="/auth/login">登录</a>后评论</div>
            <div class="comment-form" style="display:none"><textarea placeholder="写评论..." rows="2"></textarea><button onclick="Comments.submit('microblog',${postId},'#mb-comments-${postId}')">发送</button></div>
            <ul class="comments-list"></ul>
        `;
        container.dataset.loaded = '1';
        Comments.init('microblog', postId, '#mb-comments-' + postId);
    }

    async function sendMicroblog() {
        const textarea = document.getElementById('composeText');
        const content = textarea.value.trim();
        if (!content) {
            alert('请输入内容');
            return;
        }

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;
        btn.textContent = '发布中...';

        try {
            const response = await fetch('/microblog', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'content=' + encodeURIComponent(content)
            });
            const result = await response.json();

            if (result.error) {
                alert(result.error);
                btn.disabled = false;
                btn.textContent = '发布';
                return;
            }

            textarea.value = '';
            document.getElementById('charCount').textContent = '0';
            loadFeed();
        } catch (e) {
            alert('发布失败');
        } finally {
            btn.disabled = false;
            btn.textContent = '发布';
        }
    }

    async function deletePost(id) {
        if (!confirm('确定删除这条微博？')) return;
        try {
            const response = await fetch(`/api/microblog/${id}`, { method: 'DELETE' });
            const result = await response.json();
            if (result.error) {
                alert(result.error);
                return;
            }
            const el = document.getElementById(`post-${id}`);
            if (el) el.remove();
        } catch (e) {
            alert('删除失败');
        }
    }

    function openEditModal(postId) {
        editingPostId = postId;
        const btn = document.querySelector(`.btn-edit[data-content][onclick="openEditModal(${postId})"]`);
        const content = btn ? btn.dataset.content : '';
        document.getElementById('editText').value = content;
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        editingPostId = null;
        document.getElementById('editModal').style.display = 'none';
    }

    async function updatePost() {
        if (!editingPostId) return;
        const content = document.getElementById('editText').value.trim();
        if (!content) {
            alert('内容不能为空');
            return;
        }

        try {
            const response = await fetch(`/api/microblog/${editingPostId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            const result = await response.json();
            if (result.error) {
                alert(result.error);
                return;
            }
            closeEditModal();
            loadFeed();
        } catch (e) {
            alert('保存失败');
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 在已转义文本上识别 URL 并转为链接（注意：必须先 escapeHtml 再 linkify，防 XSS）
    function linkifyText(escaped) {
        return escaped.replace(/https?:\/\/[^\s<>"'\u2018-\u201f\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]+/g, function (url) {
            // 剥离尾部标点，避免把中文句号等带进链接
            const m = url.match(/[.,;:!?。，、；：！？）)」』”]+$/);
            let tail = '';
            if (m) {
                tail = m[0];
                url = url.slice(0, -tail.length);
            }
            // 转义文本中的 &amp; 在 href 属性里会由浏览器解码回 &，合法且正确
            return `<a href="${url}" target="_blank" rel="noopener noreferrer nofollow" class="post-link">${url}</a>${tail}`;
        });
    }

    function formatTime(timestamp) {
        if (!timestamp) return '';
        const now = Date.now() / 1000;
        const diff = now - timestamp;
        if (diff < 60) return '刚刚';
        if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
        if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
        if (diff < 604800) return Math.floor(diff / 86400) + '天前';
        return new Date(timestamp * 1000).toLocaleDateString('zh-CN');
    }

    // 字数统计
    document.getElementById('composeText').addEventListener('input', function() {
        document.getElementById('charCount').textContent = this.value.length;
    });

    // Ctrl+Enter 发送
    document.getElementById('composeText').addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') sendMicroblog();
    });

    // 加载用户信息
    async function loadUser() {
        try {
            const res = await fetch('/auth/me');
            const user = await res.json();
            if (!user.error) {
                const initial = user.username?.charAt(0).toUpperCase() || '?';
                document.getElementById('composeAvatar').textContent = initial;
            }
        } catch (e) {}
    }

    loadUser();
    loadFeed().then(() => {
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('post');
        if (pid) {
            // 从搜索等入口跳入，定位到指定微博（若该条不在首屏则单独拉取插入）
            loadSinglePost(pid);
        } else if (window.location.hash) {
            // 锚点滚动：从 URL hash 定位到对应帖子
            const targetId = window.location.hash.substring(1); // 去掉 #
            const targetEl = document.getElementById(targetId);
            if (targetEl) {
                targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetEl.style.transition = 'background-color 0.5s';
                targetEl.style.backgroundColor = '#fef3c7';
                setTimeout(() => targetEl.style.backgroundColor = '', 2000);
            }
        }
    });

    // 按 id 定位单条微博：首屏未加载到则拉取 /api/microblog/{id} 并插入列表顶部
    async function loadSinglePost(id) {
        try {
            const res = await fetch(`/api/microblog/${id}`);
            const post = await res.json();
            if (!post || !post.id) return;
            const feed = document.getElementById('feed');
            let target = document.getElementById(`post-${post.id}`);
            if (!target) {
                feed.insertAdjacentHTML('afterbegin', renderPostCard(post));
                renderedPostIds.push(post.id);
                target = document.getElementById(`post-${post.id}`);
            }
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                target.style.transition = 'background-color 0.5s';
                target.style.backgroundColor = '#fef3c7';
                setTimeout(() => target.style.backgroundColor = '', 2000);
            }
        } catch (e) {}
    }
</script>
{% endblock %}
